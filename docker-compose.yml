
services:
  portfolio-frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    ports:
      - "5175:5175"
    depends_on:
      - portfolio-api

  portfolio-api:
    build:
      context: ./backend
    container_name: portfolio-api
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8007
      "
    ports:
      - "8007:8007"
    environment:
      - REDIS_URL=redis://portfolio-redis:6379/0
    # keep uploaded files (project thumbnails, certificate PDFs) on the
    # host so rebuilding the container doesn't delete them
    volumes:
      - ./backend/media:/api/media
    depends_on:
      - portfolio-redis

  # channel layer for real-time messages (WebSockets)
  portfolio-redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
